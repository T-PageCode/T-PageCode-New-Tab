<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>新标签页</title>
    <style>
        body{
            background-color: white;
            user-select: none;
        }
        *{
            margin: 0px;
        }
        h1{
            position: absolute;
            top: calc(50% - 50px);
            left: 50%;
            transform: translate(-50%,-50%);
            color: black;
            font-weight: 200;
            font-size: 60px;
            white-space: nowrap;
        }
        input{
            position: absolute;
            top: calc(50% + 50px);
            left: 50%;
            transform: translate(-50%,-50%);
            background-color: rgb(255,255,255);
            color: black;
            font-weight: 200;
            width: 600px;
            height: 60px;
            border: none;
            text-align: center;
            border-radius: 100px;
            font-size: 18px;
            transition: filter 0.3s ease;
            filter: drop-shadow(0 0 15px rgb(0,0,0,0.3))
        }
        input:hover{
            filter: drop-shadow(0 0 25px rgb(0,0,0,0.3));
        }
        input::placeholder{
            color: rgb(100,100,100);
            font-weight: 400;
        }
        input:focus{
            outline: none;
        }
        input::selection{
            color: blueviolet;
        }
    </style>
</head>
<body>
    <h1>GitHub</h1>
    <input placeholder="输入GitHub关键词，或按回车跳转GitHub搜索...">
    <script src="./index.js"></script>
</body>
</html>
